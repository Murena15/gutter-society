<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Owner Dashboard | Gutter Society</title>

<link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #080808;
        color: #ffffff;
        font-family: "Inter", sans-serif;
    }

    .dashboard {
        min-height: 100vh;
        padding: 40px;
    }

    .dashboard-container {
        max-width: 1400px;
        margin: auto;
    }

    /* HEADER */

    .dashboard-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
        gap: 20px;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .brand img {
        width: 55px;
        height: 55px;
        object-fit: contain;
    }

    .brand h1 {
        font-family: "Bebas Neue", sans-serif;
        font-size: 38px;
        letter-spacing: 2px;
        margin: 0;
    }

    .brand p {
        margin: 3px 0 0;
        color: #888;
        font-size: 12px;
    }

    .logout-btn {
        padding: 12px 20px;
        background: transparent;
        color: #fff;
        border: 1px solid #333;
        cursor: pointer;
    }

    .logout-btn:hover {
        background: #fff;
        color: #000;
    }

    /* STATS */

    .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 30px;
    }

    .stat-card {
        background: #111;
        border: 1px solid #252525;
        padding: 25px;
    }

    .stat-card p {
        color: #888;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin: 0 0 10px;
    }

    .stat-card strong {
        font-family: "Bebas Neue", sans-serif;
        font-size: 38px;
    }

    /* ORDERS */

    .orders-box {
        background: #111;
        border: 1px solid #252525;
        overflow: hidden;
    }

    .orders-header {
        padding: 25px;
        border-bottom: 1px solid #252525;
    }

    .orders-header h2 {
        font-family: "Bebas Neue", sans-serif;
        font-size: 30px;
        margin: 0;
        letter-spacing: 1px;
    }

    .orders-header p {
        color: #777;
        margin: 5px 0 0;
        font-size: 13px;
    }

    /* ORDER CARD */

    .orders-list {
        display: grid;
    }

    .order-card {
        padding: 25px;
        border-bottom: 1px solid #252525;
    }

    .order-card:last-child {
        border-bottom: none;
    }

    .order-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 20px;
    }

    .order-number {
        font-weight: 700;
    }

    .order-date {
        color: #777;
        font-size: 12px;
        margin-top: 5px;
    }

    .status {
        background: #ffffff;
        color: #000;
        padding: 7px 12px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
    }

    .order-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
    }

    .order-info {
        background: #0b0b0b;
        border: 1px solid #202020;
        padding: 15px;
    }

    .order-info span {
        display: block;
        color: #777;
        font-size: 11px;
        text-transform: uppercase;
        margin-bottom: 7px;
    }

    .order-info strong {
        font-size: 14px;
        word-break: break-word;
    }

    /* PRODUCTS */

    .products {
        margin-top: 20px;
        background: #0b0b0b;
        border: 1px solid #202020;
        padding: 15px;
    }

    .products-title {
        color: #777;
        font-size: 11px;
        text-transform: uppercase;
        margin-bottom: 10px;
    }

    .product-line {
        padding: 8px 0;
        border-bottom: 1px solid #202020;
        font-size: 13px;
    }

    .product-line:last-child {
        border-bottom: none;
    }

    /* VIEW BUTTON */

    .view-order-btn {
        margin-top: 20px;
        padding: 12px 18px;
        background: #fff;
        color: #000;
        border: none;
        font-weight: 700;
        cursor: pointer;
    }

    .view-order-btn:hover {
        background: #ddd;
    }

    /* EMPTY */

    .empty {
        padding: 60px 20px;
        text-align: center;
        color: #777;
    }

    /* LOADING */

    .loading {
        padding: 50px;
        text-align: center;
        color: #777;
    }

    /* MOBILE */

    @media (max-width: 900px) {

        .dashboard {
            padding: 20px;
        }

        .stats {
            grid-template-columns: 1fr;
        }

        .order-grid {
            grid-template-columns: 1fr 1fr;
        }

    }

    @media (max-width: 600px) {

        .dashboard-header {
            align-items: flex-start;
            flex-direction: column;
        }

        .order-grid {
            grid-template-columns: 1fr;
        }

        .order-top {
            align-items: flex-start;
            flex-direction: column;
        }

    }

</style>
```

</head>

<body>

<div class="dashboard">

</div>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://fwkewtafidvthvtishax.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_vimLxkw6PKtPBwzbCuZehg_jwCzaRJZ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   ELEMENTS
========================= */

const ordersList =
    document.getElementById("ordersList");

const totalOrders =
    document.getElementById("totalOrders");

const newOrders =
    document.getElementById("newOrders");

const totalSales =
    document.getElementById("totalSales");

const logoutButton =
    document.getElementById("logoutButton");


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders() {

    ordersList.innerHTML = `
        <div class="loading">
            Loading orders...
        </div>
    `;


    const {
        data,
        error
    } = await supabaseClient
        .from("orders")
        .select("*")
        .order("created_at", {
            ascending: false
        });


    if (error) {

        console.error(
            "ORDER LOAD ERROR:",
            error
        );

        ordersList.innerHTML = `
            <div class="empty">
                Unable to load orders.
                <br><br>
                ${error.message}
            </div>
        `;

        return;
    }


    /* =========================
   UPDATE ORDER STATUS
========================= */

async function updateOrderStatus(orderId, newStatus) {

    const { error } =
        await supabaseClient
            .from("orders")
            .update({
                status: newStatus
            })
            .eq("id", orderId);

    if (error) {

        console.error(
            "STATUS UPDATE ERROR:",
            error
        );

        alert(
            "Could not update the order status.\n\n" +
            error.message
        );

        return;
    }

    console.log(
        "Order status updated:",
        newStatus
    );

    loadOrders();
}


/* =========================
   STATUS DROPDOWN
========================= */

ordersList.addEventListener(
    "change",
    event => {

        if (
            event.target.classList.contains(
                "status-select"
            )
        ) {

            const orderId =
                event.target.dataset.orderId;

            const newStatus =
                event.target.value;

            updateOrderStatus(
                orderId,
                newStatus
            );
        }
    }
);



    /* =========================
       STATS
    ========================= */

    totalOrders.textContent =
        data.length;


    const newCount =
        data.filter(
            order =>
                order.status === "New"
        ).length;


    newOrders.textContent =
        newCount;


    const sales =
        data.reduce(
            (sum, order) =>
                sum + Number(order.total || 0),
            0
        );


    totalSales.textContent =
        `R${sales}`;


    /* =========================
       EMPTY
    ========================= */

    if (data.length === 0) {

        ordersList.innerHTML = `
            <div class="empty">
                No orders yet.
            </div>
        `;

        return;
    }


    /* =========================
       DISPLAY ORDERS
    ========================= */

    ordersList.innerHTML = "";


    data.forEach(order => {

        const card =
            document.createElement("article");

        card.className =
            "order-card";


        const createdDate =
            order.created_at
                ? new Date(
                    order.created_at
                ).toLocaleString()
                : "Unknown";


        let productsHTML = "";


        if (Array.isArray(order.products)) {

            productsHTML =
                order.products.map(
                    product => `
                        <div class="product-line">

                            <strong>
                                ${product.product}
                            </strong>

                            × ${product.quantity}

                            — ${product.size || "One Size"}

                            — R${product.price}

                        </div>
                    `
                ).join("");

        }


        card.innerHTML = `

            <div class="order-top">

                <div>

                    <div class="order-number">
                        ${order.order_number}
                    </div>

                    <div class="order-date">
                        ${createdDate}
                    </div>

                </div>

                <div>
    <select
        class="status-select"
        data-order-id="${order.id}"
    >
        <option value="New" ${order.status === "New" ? "selected" : ""}>
            New
        </option>

        <option value="Processing" ${order.status === "Processing" ? "selected" : ""}>
            Processing
        </option>

        <option value="Shipped" ${order.status === "Shipped" ? "selected" : ""}>
            Shipped
        </option>

        <option value="Completed" ${order.status === "Completed" ? "selected" : ""}>
            Completed
        </option>
    </select>
</div>

            </div>


            <div class="order-grid">


                <div class="order-info">

                    <span>Customer</span>

                    <strong>
                        ${order.customer_name}
                    </strong>

                </div>


                <div class="order-info">

                    <span>Email</span>

                    <strong>
                        ${order.customer_email}
                    </strong>

                </div>


                <div class="order-info">

                    <span>Phone</span>

                    <strong>
                        ${order.phone}
                    </strong>

                </div>


                <div class="order-info">

                    <span>Total</span>

                    <strong>
                        R${order.total}
                    </strong>

                </div>


                <div class="order-info">

                    <span>Address</span>

                    <strong>
                        ${order.address}
                    </strong>

                </div>


                <div class="order-info">

                    <span>City</span>

                    <strong>
                        ${order.city}
                    </strong>

                </div>


                <div class="order-info">

                    <span>Province</span>

                    <strong>
                        ${order.province}
                    </strong>

                </div>


                <div class="order-info">

                    <span>Postal Code</span>

                    <strong>
                        ${order.postal_code}
                    </strong>

                </div>


            </div>


            <div class="products">

                <div class="products-title">
                    Products Ordered
                </div>

                ${productsHTML}

            </div>

        `;


        ordersList.appendChild(card);

    });

}


/* =========================
   LOGOUT
========================= */

logoutButton.addEventListener(
    "click",
    async () => {

        await supabaseClient.auth.signOut();

        window.location.href =
            "owner-login.html";

    }
);


/* =========================
   CHECK OWNER LOGIN
========================= */

async function checkOwnerLogin() {

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();


    if (!session) {

        window.location.href =
            "owner-login.html";

        return;

    }


    console.log(
        "Owner logged in:",
        session.user.email
    );

    loadOrders();

}


/* =========================
   START
========================= */

checkOwnerLogin();

</script>

</body>

</html>
