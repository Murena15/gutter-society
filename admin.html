                </strong>

<script>

"use strict";


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://fwkewtafidvthvtishax.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_vimLxkw6PKtPBwzbCuZehg_jwCzaRJZ";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   ELEMENTS
========================= */

const loginScreen =
    document.getElementById("loginScreen");

const dashboard =
    document.getElementById("dashboard");

const loginForm =
    document.getElementById("loginForm");

const loginError =
    document.getElementById("loginError");

const ownerEmail =
    document.getElementById("ownerEmail");

const ordersBody =
    document.getElementById("ordersBody");

const searchOrders =
    document.getElementById("searchOrders");

const totalOrders =
    document.getElementById("totalOrders");

const newOrders =
    document.getElementById("newOrders");

const completedOrders =
    document.getElementById("completedOrders");

const totalSales =
    document.getElementById("totalSales");

const logoutBtn =
    document.getElementById("logoutBtn");

const modalOverlay =
    document.getElementById("modalOverlay");

const closeModal =
    document.getElementById("closeModal");

const modalOrderNumber =
    document.getElementById("modalOrderNumber");

const orderDetails =
    document.getElementById("orderDetails");


let allOrders = [];


/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        loginError.classList.remove("show");


        const email =
            document
                .getElementById("loginEmail")
                .value
                .trim();


        const password =
            document
                .getElementById("loginPassword")
                .value;


        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });


        if (error) {

            console.error(error);

            loginError.textContent =
                "Login failed. Check your email and password.";

            loginError.classList.add("show");

            return;

        }


        showDashboard(
            data.user
        );

    }
);


/* =========================
   CHECK EXISTING SESSION
========================= */

async function checkSession() {

    const {
        data: {
            session
        }
    } =
        await supabaseClient.auth.getSession();


    if (session) {

        showDashboard(
            session.user
        );

    }

}


checkSession();


/* =========================
   SHOW DASHBOARD
========================= */

async function showDashboard(user) {

    loginScreen.style.display =
        "none";

    dashboard.classList.add(
        "show"
    );

    ownerEmail.textContent =
        user.email || "";

    await loadOrders();

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders() {

    ordersBody.innerHTML = `
        <tr>
            <td colspan="6" style="text-align:center;padding:40px;">
                Loading orders...
            </td>
        </tr>
    `;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("orders")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(error);

        ordersBody.innerHTML = `
            <tr>
                <td colspan="6" style="text-align:center;padding:40px;">
                    Unable to load orders.
                </td>
            </tr>
        `;

        return;

    }


    allOrders =
        data || [];


    updateStats();

    displayOrders(
        allOrders
    );

}


/* =========================
   STATS
========================= */

function updateStats() {

    const total =
        allOrders.length;


    const newCount =
        allOrders.filter(
            order =>
                order.status === "New"
        ).length;


    const completedCount =
        allOrders.filter(
            order =>
                order.status === "Completed"
        ).length;


    const sales =
        allOrders.reduce(
            (sum, order) =>
                sum +
                Number(order.total || 0),
            0
        );


    totalOrders.textContent =
        total;


    newOrders.textContent =
        newCount;


    completedOrders.textContent =
        completedCount;


    totalSales.textContent =
        `R${sales.toFixed(2)}`;

}


/* =========================
   DISPLAY ORDERS
========================= */

function displayOrders(orders) {

    ordersBody.innerHTML = "";


    if (orders.length === 0) {

        ordersBody.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="empty-orders"
                >
                    No orders found.
                </td>
            </tr>
        `;

        return;

    }


    orders.forEach(
        order => {

            const row =
                document.createElement("tr");


            const date =
                new Date(
                    order.created_at
                ).toLocaleString(
                    "en-ZA",
                    {
                        dateStyle: "medium",
                        timeStyle: "short"
                    }
                );


            row.innerHTML = `

                <td>
                    <strong>
                        ${escapeHTML(order.order_number)}
                    </strong>
                </td>

                <td>
                    ${escapeHTML(order.customer_name)}
                </td>

                <td>
                    ${date}
                </td>

                <td>
                    R${Number(order.total).toFixed(2)}
                </td>

                <td>

                    <select
                        class="status-select"
                        data-id="${order.id}"
                    >

                        <option
                            value="New"
                            ${order.status === "New" ? "selected" : ""}
                        >
                            New
                        </option>

                        <option
                            value="Processing"
                            ${order.status === "Processing" ? "selected" : ""}
                        >
                            Processing
                        </option>

                        <option
                            value="Completed"
                            ${order.status === "Completed" ? "selected" : ""}
                        >
                            Completed
                        </option>

                    </select>

                </td>

                <td>

                    <button
                        class="view-btn"
                        data-id="${order.id}"
                    >
                        View
                    </button>

                </td>

            `;


            ordersBody.appendChild(
                row
            );

        }
    );


    document
        .querySelectorAll(".status-select")
        .forEach(
            select => {

                select.addEventListener(
                    "change",
                    function() {

                        updateOrderStatus(
                            this.dataset.id,
                            this.value
                        );

                    }
                );

            }
        );


    document
        .querySelectorAll(".view-btn")
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    function() {

                        const order =
                            allOrders.find(
                                item =>
                                    String(item.id) ===
                                    String(this.dataset.id)
                            );


                        if (order) {

                            showOrderDetails(
                                order
                            );

                        }

                    }
                );

            }
        );

}


/* =========================
   SEARCH
========================= */

searchOrders.addEventListener(
    "input",
    function() {

        const query =
            this.value
                .toLowerCase()
                .trim();


        const filtered =
            allOrders.filter(
                order =>

                    String(
                        order.order_number
                    )
                        .toLowerCase()
                        .includes(query)

                    ||

                    String(
                        order.customer_name
                    )
                        .toLowerCase()
                        .includes(query)

                    ||

                    String(
                        order.customer_email
                    )
                        .toLowerCase()
                        .includes(query)

            );


        displayOrders(
            filtered
        );

    }
);


/* =========================
   UPDATE STATUS
========================= */

async function updateOrderStatus(
    orderId,
    newStatus
) {

    const {
        error
    } =
        await supabaseClient
            .from("orders")
            .update({
                status: newStatus
            })
            .eq(
                "id",
                orderId
            );


    if (error) {

        console.error(error);

        alert(
            "Unable to update order status."
        );

        return;

    }


    await loadOrders();

}


/* =========================
   ORDER DETAILS
========================= */

function showOrderDetails(
    order
) {

    modalOrderNumber.textContent =
        order.order_number;


    let productsHTML = "";


    let products = [];


    try {

        products =
            typeof order.products === "string"
                ? JSON.parse(order.products)
                : order.products;

    } catch (error) {

        products = [];

    }


    if (Array.isArray(products)) {

        products.forEach(
            product => {

                const quantity =
                    Number(
                        product.quantity || 1
                    );


                const price =
                    Number(
                        product.price || 0
                    );


                const itemTotal =
                    price * quantity;


                productsHTML += `

                    <div class="product-line">

                        <strong>
                            ${escapeHTML(
                                product.product ||
                                "Product"
                            )}
                        </strong>

                        <span>
                            Size:
                            ${escapeHTML(
                                product.size ||
                                "One Size"
                            )}

                            &nbsp; | &nbsp;

                            Quantity:
                            ${quantity}

                            &nbsp; | &nbsp;

                            R${itemTotal.toFixed(2)}
                        </span>

                    </div>

                `;

            }
        );

    }


    orderDetails.innerHTML = `

        <div class="detail-section">

            <h3>
                Customer
            </h3>

            <div class="detail-row">
                <span>Name</span>
                <strong>
                    ${escapeHTML(order.customer_name)}
                </strong>
            </div>

            <div class="detail-row">
                <span>Email</span>
                <strong>
                    ${escapeHTML(order.customer_email)}
                </strong>
            </div>

            <div class="detail-row">
                <span>Phone</span>
                <strong>
                    ${escapeHTML(order.phone)}
                </strong>
            </div>

        </div>


        <div class="detail-section">

            <h3>
                Delivery
            </h3>

            <div class="detail-row">
                <span>Address</span>
                <strong>
                    ${escapeHTML(order.address)}
                </strong>
            </div>

            <div class="detail-row">
                <span>City</span>
                <strong>
                    ${escapeHTML(order.city)}
                </strong>
            </div>

            <div class="detail-row">
                <span>Province</span>
                <strong>
                    ${escapeHTML(order.province)}
                </strong>
            </div>

            <div class="detail-row">
                <span>Postal Code</span>
                <strong>
                    ${escapeHTML(order.postal_code)}
                </strong>
            </div>

        </div>


        <div class="detail-section">

            <h3>
                Products
            </h3>

            ${productsHTML || "No products found."}

        </div>


        <div class="modal-total">

            <span>
                Total
            </span>

            <strong>
                R${Number(order.total).toFixed(2)}
            </strong>

        </div>

    `;


    modalOverlay.classList.add(
        "show"
    );

}

        modalOverlay.classList.remove(

        );

    }

modalOverlay.addEventListener(
    "click",

        if (

/* =========================

========================= */

function escapeHTML(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
