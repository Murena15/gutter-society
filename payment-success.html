
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Payment Confirmation | Gutter Society">
    <title>Payment Confirmation | Gutter Society</title>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #080808;
            color: #fff;
            font-family: "Inter", sans-serif;
            min-height: 100vh;
        }

        .success-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .success-box {
            width: 100%;
            max-width: 650px;
            background: #111;
            border: 1px solid #252525;
            padding: 55px 35px;
            text-align: center;
            box-sizing: border-box;
        }

        .success-icon {
            width: 70px;
            height: 70px;
            border: 2px solid #777;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 32px;
        }

        .success-box h1 {
            font-family: "Bebas Neue", sans-serif;
            font-size: 55px;
            letter-spacing: 2px;
            margin: 0 0 15px;
        }

        .success-box p {
            color: #aaa;
            line-height: 1.7;
            margin: 10px 0;
        }

        .order-number {
            color: #fff !important;
            font-weight: 700;
            font-size: 18px;
            margin-top: 25px !important;
        }

        .payment-status {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            border: 1px solid #333;
            color: #fff;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .back-shop {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 25px;
            background: #fff;
            color: #000;
            text-decoration: none;
            font-weight: 700;
            letter-spacing: 1px;
            transition: 0.25s ease;
        }

        .back-shop:hover {
            background: #ddd;
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .success-box {
                padding: 45px 25px;
            }

            .success-box h1 {
                font-size: 45px;
            }
        }
    </style>
</head>

<body>

<main class="success-page">
    <div class="success-box">

        <div class="success-icon" id="successIcon">...</div>

        <h1 id="successTitle">Checking Payment</h1>

        <p id="successMessage">
            Please wait while we verify your payment securely.
        </p>

        <p class="order-number" id="orderNumber">
            Order Number: Loading...
        </p>

        <div class="payment-status" id="paymentStatus">
            Checking
        </div>

        <p id="additionalMessage">
            Your order confirmation will appear here.
        </p>

        <a href="shop.html" class="back-shop">
            BACK TO SHOP
        </a>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

const SUPABASE_URL =
    "https://fwkewtafidvthvtishax.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_vimLxkw6PKtPBwzbCuZehg_jwCzaRJZ";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const params = new URLSearchParams(window.location.search);
const orderNumber = params.get("order");

const title = document.getElementById("successTitle");
const message = document.getElementById("successMessage");
const number = document.getElementById("orderNumber");
const status = document.getElementById("paymentStatus");
const additional = document.getElementById("additionalMessage");
const icon = document.getElementById("successIcon");

number.textContent = orderNumber
    ? `Order Number: ${orderNumber}`
    : "Order Number: Not available";

function showState(heading, description, paymentLabel, extra, symbol) {
    title.textContent = heading;
    message.textContent = description;
    status.textContent = paymentLabel;
    additional.textContent = extra;
    icon.textContent = symbol;
}

async function verifyPayment() {
    if (!orderNumber) {
        showState(
            "Order Not Found",
            "We could not identify your order.",
            "Not Verified",
            "Please contact Gutter Society for assistance.",
            "!"
        );
        return;
    }

    try {
        const { data, error } = await supabaseClient
            .from("orders")
            .select("order_number, payment_status")
            .eq("order_number", orderNumber)
            .maybeSingle();

        if (error) {
            throw error;
        }

        if (!data) {
            showState(
                "Order Not Found",
                "We could not locate this order.",
                "Not Verified",
                "Please contact Gutter Society for assistance.",
                "!"
            );
            return;
        }

        if (
            String(data.payment_status).toLowerCase() === "paid"
        ) {
            showState(
                "Payment Confirmed",
                "Thank you for your order with Gutter Society.",
                "Payment Verified",
                "Your payment has been confirmed. Your order is now recorded.",
                "✓"
            );
            return;
        }

        showState(
            "Payment Processing",
            "Your payment has not yet been confirmed.",
            "Awaiting Confirmation",
            "Please allow some time for payment confirmation. If this continues, contact Gutter Society.",
            "..."
        );

    } catch (error) {
        console.error("Payment verification error:", error);

        showState(
            "Verification Unavailable",
            "We could not verify your payment right now.",
            "Please Wait",
            "Please refresh this page shortly or contact Gutter Society.",
            "!"
        );
    }
}

verifyPayment();
</script>

</body>
</html>
